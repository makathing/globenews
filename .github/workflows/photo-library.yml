name: Refresh photo library

# Manual only. Picks openly licensed illustrative photos per news topic from
# Wikimedia Commons (pipeline/src/build-photo-library.ts) and proposes them as
# a pull request whose body is the rendered gallery — nothing reaches the site
# until a person has looked at the pictures and merged. Runs here rather than
# in the pipeline's environment because that one cannot reach Commons.
#
# Two ways in:
#  - Run workflow (workflow_dispatch): proposes the library as a new PR on
#    branch photo-library/refresh. Needs "Allow GitHub Actions to create and
#    approve pull requests" in Settings → Actions → General.
#  - Push any branch named photo-library/** and open a PR from it yourself:
#    the run fills that same branch and PR with the photos. No setting needed,
#    because the workflow only commits and edits an existing PR, never opens one.
#    Its own commit doesn't re-trigger it (GITHUB_TOKEN pushes start no runs).
#    A branch named photo-library/localise* instead only self-hosts the photos
#    already in the library (no Commons search, same photos): it downloads each
#    one, stores a card-sized WebP under frontend/public/library/ and records
#    it as `local` in data/photo-library.json.
#
# Every run commits frontend/public/library/ alongside the JSON: the site
# serves those copies first, so the last real picture a story can fall back
# to never depends on a third-party host accepting a hotlink.
on:
  workflow_dispatch:
  push:
    branches: ['photo-library/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: photo-library
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Exits non-zero without writing anything if Commons is unreachable, so
      # a blocked run fails visibly instead of looking like "nothing new".
      # Topics whose searches fail keep their current photos.
      - name: Refresh the library from Commons
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref_name, 'photo-library/localise')) }}
        run: npm run pipeline:photo-library

      # One-off: self-host the photos already listed, without searching again.
      - name: Self-host the photos already in the library
        if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'photo-library/localise') }}
        run: npm run pipeline:photo-library:localise

      - id: diff
        run: |
          if [ -n "$(git status --porcelain -- data/photo-library.json frontend/public/library/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to the photo library; no pull request needed."
          fi

      # One standing review branch, force-updated on every refresh: re-running
      # replaces the proposal rather than stacking PRs. The body is the gallery
      # cut to GitHub's 65,536-character limit (pipeline/.staging/…); the full
      # gallery is committed as data/photo-library.md.
      - name: Open or update the review pull request
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: photo-library/refresh
          BASE: ${{ github.event.repository.default_branch }}
          BODY: pipeline/.staging/photo-library-pr.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add data/photo-library.json data/photo-library.md
          # new copies and removed orphans; the folder only exists once a photo was self-hosted
          git add -A -- frontend/public/library/ 2>/dev/null || true
          git commit -m "data: refresh illustrative photo library"
          git push --force origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$BODY"
            echo "Updated pull request #$existing"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Refresh illustrative photo library" \
              --body-file "$BODY"
          fi

      # Pushed branch: commit the photos onto it and, if a PR is open from it,
      # show the gallery as the PR description (editing a PR needs no setting).
      - name: Fill the pushed branch and its pull request
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          BODY: pipeline/.staging/photo-library-pr.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photo-library.json data/photo-library.md
          # new copies and removed orphans; the folder only exists once a photo was self-hosted
          git add -A -- frontend/public/library/ 2>/dev/null || true
          git commit -m "data: illustrative photo library from Wikimedia Commons"
          git push origin "HEAD:$BRANCH"

          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$BODY"
            echo "Gallery posted to pull request #$pr"
          else
            echo "No open pull request from $BRANCH yet; the photos are committed to the branch."
          fi
