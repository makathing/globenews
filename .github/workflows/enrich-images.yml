name: Resolve article preview images

# Preview images need internet, not intelligence: the enrichment pass is fetch
# plus a regex, with no model call and no API key. The agent pipeline runs on
# the owner's Claude subscription in an environment that cannot reach news
# publishers, so this half runs here — on a runner with open egress, using only
# the default GITHUB_TOKEN. No secret is stored, so the project stays tokenless.

on:
  schedule:
    # half an hour behind the daily batch Routine, so it enriches fresh events
    - cron: '30 6 * * *'
  workflow_dispatch:

# Deliberately NOT triggered by pushes to data/** — this job commits to data/,
# which would retrigger itself. The commit it makes fires deploy.yml, which is
# the intended chain: enrich, then publish.

permissions:
  contents: write

concurrency:
  group: enrich-images
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pipeline:enrich

      - name: Commit resolved images
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "no image changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Resolve article preview images"
          git push
