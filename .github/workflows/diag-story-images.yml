name: Diagnose story images (temporary)
on:
  push:
    branches: ['diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium webkit
      - run: node .github/diag/story-images.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-out
          path: diag-out
