name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  # The enrichment workflow commits resolved images to data/, but a push made
  # with GITHUB_TOKEN deliberately does not trigger other workflows — GitHub
  # blocks that to prevent recursion. So the push filter above never sees it,
  # and without this the images would sit on main undeployed.
  workflow_run:
    workflows: ['Resolve article preview images']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run fires on completion whatever the outcome, so don't publish
    # off the back of an enrichment run that failed.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      # Provisions Pages if it has never been enabled, so a fresh clone of this
      # repo deploys without anyone visiting Settings first. Without it,
      # deploy-pages fails with a bare 404 that reads like a permissions error.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
