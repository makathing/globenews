name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Provisions Pages if it has never been enabled, so a fresh clone of this
      # repo deploys without anyone visiting Settings first. Without it,
      # deploy-pages fails with a bare 404 that reads like a permissions error.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Preview images are presentation, not data: derived, best-effort and
      # re-derivable at any time. Resolving them here — into the ephemeral
      # checkout, never committed — means the repo holds news and the build
      # adds art. prebuild's copy-data.mjs then copies the enriched file into
      # public/, and vite-plugin-seo reads the same file for per-story og:image.
      #
      # This used to be a separate workflow that committed to data/, which
      # collided with every pull request that touched the dataset.
      - run: npm run pipeline:enrich

      - run: npm run build -w frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
